<html>
    <head>
        <title>Student Registration</title>
    </head>

    <body>

        <h1>Student Registration Form</h1>

        <form action="https://www.google.com" method="get">

            <fieldset>
                <legend>Personal Information</legend>

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="fullname"
                       placeholder="Enter your full name"
                       required minlength="3" maxlength="30">
                <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email"
                       placeholder="example@gmail.com" required>
                <br><br>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password"
                       placeholder="Enter password"
                       required minlength="8">
                <br><br>

                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob"
                       min="1990-01-01" max="2010-12-31">
                <br><br>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone"
                       placeholder="Enter phone number">
                <br><br>
            </fieldset>

            <br>

            <fieldset>
                <legend>Academic Information</legend>

                <label for="qualification">Highest Qualification:</label>
                <select id="qualification" name="qualification">
                    <option value="">-- Select Qualification --</option>
                    <option value="10th">10th</option>
                    <option value="12th">12th</option>
                    <option value="btech" selected>B.Tech</option>
                    <option value="mtech">M.Tech</option>
                </select>
                <br><br>

                <label>Gender:</label>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>

                <input type="radio" id="other" name="gender" value="other">
                <label for="other">Other</label>
                <br><br>

                <label for="marks">Percentage:</label>
                <input type="number" id="marks" name="marks"
                       min="0" max="100" step="0.01"
                       placeholder="Enter percentage">
                <br><br>

                <label>Skills:</label>
                <input type="checkbox" id="java" name="skills" value="java">
                <label for="java">Java</label>

                <input type="checkbox" id="python" name="skills" value="python">
                <label for="python">Python</label>

                <input type="checkbox" id="html" name="skills" value="html" checked>
                <label for="html">HTML</label>

                <input type="checkbox" id="sql" name="skills" value="sql">
                <label for="sql">SQL</label>
                <br><br>
            </fieldset>

            <br>

            <fieldset>
                <legend>Other Information</legend>

                <label for="address">Address:</label><br>
                <textarea id="address" name="address"
                          rows="5" cols="40"
                          placeholder="Enter your complete address"
                          maxlength="200"></textarea>
                <br><br>

                <label for="resume">Upload Resume:</label>
                <input type="file" id="resume" name="resume">
                <br><br>

                <label for="website">Portfolio Website:</label>
                <input type="url" id="website" name="website"
                       placeholder="https://example.com">
                <br><br>

                <label for="course">Preferred Course:</label>
                <select id="course" name="course">
                    <option value="java">Java Development</option>
                    <option value="python">Python Development</option>
                    <option value="web">Web Development</option>
                    <option value="android">Android Development</option>
                </select>
                <br><br>

                <input type="checkbox" id="terms" name="terms" value="accepted" required>
                <label for="terms">I accept the Terms and Conditions</label>
                <br><br>
            </fieldset>

            <br>

            <button type="submit">Register</button>
            <button type="reset">Clear Form</button>
            <button type="button" onclick="alert('Welcome to Student Registration!')">
                Click Me
            </button>

        </form>

    </body>
</html>
